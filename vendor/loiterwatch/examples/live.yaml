# Live webcam demo policy: the whole camera view is the restricted area.
# Thresholds are deliberately short so you can test it at your desk in under a
# minute. Raise them a long way before using this anywhere real.

exit_grace_s: 3      # webcams drop frames; keep a visit open across short gaps
tick_s: 0.5

defaults:
  min_confidence: 0.5
  cooldown_s: 30

rules:
  - id: live_intrusion
    type: intrusion
    confirm_s: 3               # reject one-frame noise
    min_observations: 5
    severity: warning
    escalate:
      - {after_s: 15,  severity: critical}
      - {after_s: 60,  severity: critical}

  # Total time across visits -- catches someone stepping out and back to
  # keep the continuous timer from ever reaching its threshold.
  - id: live_total_time
    type: cumulative_dwell
    threshold_s: 30
    window_s: 300
    min_visit_s: 1
    severity: critical

  - id: live_repeat_entry
    type: repeat_entry
    count: 3
    window_s: 300
    min_visit_s: 2
    min_gap_s: 5
    severity: warning
