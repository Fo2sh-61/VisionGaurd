# نموذج الإعدادات — انسخه إلى cameras.yaml أو شغّل: python run.py setup
# Example config — copy to cameras.yaml, or just run: python run.py setup

site_name: كمبوند النخيل
timezone: Africa/Cairo
web_host: 0.0.0.0
web_port: 8080

# اجمع صور اللوحات تلقائيًا لتدريب النموذج لاحقًا على كاميراتك أنت.
# Bank every plate crop so you can fine-tune on your own camera later.
collect_dataset: true
collect_max_per_day: 3000
keep_snapshot_days: 90

alert_on_unknown: true
alert_on_blacklist: true

recognition:
  plate_detector_weights: models/plate_detector.pt
  char_detector_weights: models/char_detector.pt
  ocr_backend: auto          # auto | yolo_chars | easyocr | stub
  detector_backend: auto     # auto | yolo | classical
  min_detect_conf: 0.35
  min_votes: 3               # frames that must agree before logging a car
  min_accept_conf: 0.55      # below this the read is flagged for the guard
  dedupe_seconds: 60         # same plate, same camera, within 60s = one visit
  device: auto               # auto | cpu | cuda | 0

cameras:
  # ── البوابة الرئيسية / main gate ──────────────────────────────────────
  - id: gate1_entry
    name: البوابة الرئيسية - دخول
    source: rtsp://admin:PASSWORD@192.168.1.64:554/Streaming/Channels/101
    gate_number: 1
    direction: entry
    enabled: true
    # منطقة الاهتمام: جزء الصورة الذي تتوقف فيه السيارة (x1,y1,x2,y2 كنسب)
    # Region of interest — the part of the frame where cars actually stop.
    roi: [0.15, 0.35, 0.85, 0.95]
    min_plate_width_px: 60
    rotate: 0
    fps_limit: 8.0

  - id: gate1_exit
    name: البوابة الرئيسية - خروج
    source: rtsp://admin:PASSWORD@192.168.1.65:554/Streaming/Channels/101
    gate_number: 1
    direction: exit
    roi: [0.15, 0.35, 0.85, 0.95]

  # ── بوابة الخدمات / service gate ──────────────────────────────────────
  - id: gate2_entry
    name: بوابة الخدمات - دخول
    source: rtsp://admin:PASSWORD@192.168.1.66:554/Streaming/Channels/101
    gate_number: 2
    direction: entry

  - id: gate2_exit
    name: بوابة الخدمات - خروج
    source: rtsp://admin:PASSWORD@192.168.1.67:554/Streaming/Channels/101
    gate_number: 2
    direction: exit
